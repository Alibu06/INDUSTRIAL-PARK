name: Windows Offline EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Run simulation tests
        run: npm test
      - name: Build offline portable EXE
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish Windows EXE as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Industrial-Park-Windows-v1
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
